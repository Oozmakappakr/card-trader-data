<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카드 트레이더</title>
<style>
/* 토스 디자인 시스템(TDS) — docs/toss-design.md 참조.
   Toss Product Sans 는 전용 서체라 시스템 서체로 대체하고 체계만 따랐다. */
:root{
  --primary:#3182f6; --primary-hover:#2272eb;
  --fg:#191f28; --body:#4e5968; --muted:#8b95a1;
  --surface:#f2f4f6; --border:#e5e8eb; --canvas:#fff;
  --danger:#e42939; --weak-bg:#e8f3ff; --weak-fg:#1b64da;
  --lg:16px; --xl:24px; --xxl:32px; --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{background:var(--surface);color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:24px;padding-bottom:calc(70px + var(--safe-b));}
h2{font-size:24px;font-weight:600;line-height:36px;color:var(--fg);margin:0}
h4{font-size:17px;font-weight:600;line-height:26px;color:var(--fg);margin:0}
.small{font-size:14px;line-height:21px}
.muted{color:var(--muted)}
.num{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}

header{position:sticky;top:0;z-index:20;background:var(--canvas);
  padding:var(--lg) var(--lg) 12px;border-bottom:1px solid var(--border)}
header .t{font-size:22px;font-weight:700;color:var(--fg);line-height:33px}
header .s{font-size:13px;color:var(--muted);margin-top:2px}
main{padding:var(--lg)}
.card{background:var(--canvas);border-radius:var(--r);padding:var(--xl) var(--lg);
  margin-bottom:var(--lg)}
.row{display:flex;align-items:center;gap:var(--lg)}
.between{justify-content:space-between}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border:0;
  border-radius:17px;background:var(--surface);color:var(--body);
  font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap}
.chip.on{background:var(--weak-bg);color:var(--weak-fg)}

button.p{width:100%;height:56px;border:0;border-radius:var(--r);background:var(--primary);
  color:#fff;font-size:17px;font-weight:600;font-family:inherit}
button.p:active{background:var(--primary-hover)}
button.p.g{background:var(--surface);color:var(--body)}

.item{display:flex;align-items:center;gap:var(--lg);padding:var(--lg) 0;
  border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.rank{width:26px;flex:0 0 26px;text-align:center;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.bd{flex:1;min-width:0}
.nm{color:var(--fg);font-weight:600;font-size:16px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:13px;color:var(--muted);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vl{text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;
  font-weight:600;background:var(--weak-bg);color:var(--weak-fg)}
.tag.g{background:var(--surface);color:var(--muted)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--canvas);
  border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-b)}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;font-family:inherit;
  font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:3px}
nav button.on{color:var(--primary)}
nav .ic{font-size:19px;line-height:19px}

.empty{padding:var(--xxl) var(--lg);text-align:center;color:var(--muted);font-size:14px}
.err{background:#fff;border-radius:var(--r);padding:var(--xl) var(--lg);
  color:var(--danger);font-size:14px}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 공략 본문 — 읽는 화면이라 행간을 넉넉히 */
.doc{font-size:15.5px;line-height:27px;color:var(--body)}
.doc h1,.doc h2,.doc h3{color:var(--fg);font-size:18px;line-height:28px;
  font-weight:700;margin:26px 0 8px}
.doc p{margin:0 0 14px}
.doc b{color:var(--fg)}
.doc code{background:var(--surface);border-radius:4px;padding:1px 5px;font-size:13.5px}
.doc pre{background:var(--surface);border-radius:10px;padding:14px;overflow-x:auto;
  font-size:12.5px;line-height:20px;margin:0 0 16px}
.doc blockquote{margin:0 0 16px;padding:12px 14px;background:var(--surface);
  border-radius:10px;font-size:14px;line-height:23px;color:var(--muted)}
.doc table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14px}
.doc th,.doc td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left}
.doc th{color:var(--muted);font-weight:600;font-size:12.5px}
.doc ul{margin:0 0 16px;padding-left:20px}
.doc li{margin-bottom:6px}

/* 전개가 언제 기준인지 */
.newtx{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
  font-size:13px;line-height:20px;color:var(--body);white-space:pre-wrap}
.why{padding:var(--lg) 0;border-bottom:1px solid var(--border)}\n.why:last-child{border-bottom:0}\n.whytx{margin-top:6px;font-size:14px;line-height:22px;color:var(--body)}\n.whytx p{margin:0}\n.whytx b{color:var(--fg)}\n/* 카드 이름 — 누를 수 있다는 걸 밑줄로만 알린다. 색을 주면 글이 알록달록해진다 */
.ctr{padding:var(--lg)}
.ctr-h{font-size:15px;font-weight:600;color:var(--fg)}
.ctr-ax{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.axchip{font-size:12.5px;padding:3px 9px;border-radius:999px;
  background:var(--weak-bg);color:var(--weak-fg)}
.axchip b{font-variant-numeric:tabular-nums}
.ctr-b{font-size:12.5px;line-height:19px;color:var(--muted);margin-top:6px}
.ctr-s{font-size:13px;font-weight:600;color:var(--fg);margin:14px 0 6px;
  padding-top:12px;border-top:1px solid var(--border)}
.ctr-r{padding:8px 0;border-bottom:1px dashed var(--border)}
.ctr-r:last-of-type{border-bottom:0}
.ctr-r2{padding:6px 0}
.ctr-n{font-size:14px;color:var(--danger);font-weight:600}
.ctr-w{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wchip{font-size:11.5px;padding:2px 7px;border-radius:6px;
  background:var(--surface);color:var(--body)}
.ctr-e{font-size:13px;line-height:20px;color:var(--body);margin-top:4px}
.ctr-p{display:flex;gap:7px;align-items:flex-start;margin-top:5px}
.ctr-q{font-size:12.5px;line-height:19px;color:var(--body);flex:1}
.ctr-o{font-size:12.5px;color:var(--muted);margin-top:3px}
.eff{color:var(--primary);font-weight:600}
.pop-w{font-size:11.5px;color:var(--primary);margin-top:8px}
.cardw{border-bottom:1px dashed var(--muted);cursor:pointer}
.cardw:active{background:var(--weak-bg)}
.pop{position:fixed;z-index:60;background:var(--card,#fff);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.16);
  max-height:46vh;overflow-y:auto}
.pop-n{font-size:15px;font-weight:600;color:var(--fg);line-height:22px}
.pop-s{font-size:12.5px;color:var(--primary);margin-top:3px}
.pop-t{font-size:13.5px;line-height:21px;color:var(--body);margin-top:8px;white-space:pre-wrap}
.orig{font-size:12.5px;line-height:19px;color:var(--muted);margin-top:2px}\n.fr{padding:var(--lg)}
.fr-h{display:flex;align-items:center;gap:8px;font-size:14px;line-height:22px;color:var(--fg)}
.fr-h b{font-weight:600}
.fr-ok,.fr-no,.fr-un{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;flex:0 0 auto}
.fr-ok{background:var(--weak-bg);color:var(--weak-fg)}
.fr-no{background:#ffeaec;color:var(--danger)}
.fr-un{background:var(--surface);color:var(--muted)}
.fr-b{font-size:13px;line-height:20px;color:var(--muted);margin-top:4px}
.fr-cav{margin-top:12px;padding:10px 12px;background:var(--surface);border-radius:10px;
  font-size:13px;line-height:20px;color:var(--body)}
.fr-cav p{margin:0}
.fr-cav b{color:var(--fg)}
.fr-new{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.fr-nh{font-size:13px;font-weight:600;color:var(--danger);margin-bottom:8px}
.fr-nr{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;
  line-height:22px;color:var(--body)}
.fr-nr b{font-variant-numeric:tabular-nums;color:var(--fg);flex:0 0 auto}

/* 전개 단계 — 저지점이 붙은 단계는 왼쪽에 붉은 선을 준다 */
.step{padding:var(--lg) 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:0}
.step-h{display:flex;gap:var(--lg);align-items:flex-start}
.step-n{width:26px;flex:0 0 26px;text-align:center;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--primary);font-size:15px;line-height:23px}
.step-t{color:var(--fg);font-size:15px;line-height:23px}
.step.danger .step-n{color:var(--danger)}
.step.warn .step-n{color:#f59e0b}
.gs{margin:8px 0 0 42px;padding:9px 12px;background:var(--surface);
  border-radius:10px;border-left:3px solid #f0b429}
.gs b{color:var(--fg)}
.gs-w{font-size:11.5px;line-height:18px;color:var(--muted);margin-top:3px}
.gs-x{color:#f0b429;font-weight:700}
.hit{margin:10px 0 0 42px;padding:12px 14px;background:#fff5f5;
  border-radius:12px;border-left:3px solid var(--danger)}
.hit-h{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:14px;line-height:21px}
.hit-x{color:var(--danger);font-weight:700}
.hit-h b{color:var(--danger)}
.hit-p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--primary);font-size:15px}
.hit-b{font-size:13.5px;line-height:21px;color:var(--body);margin-top:4px}
.hit-o{font-size:13.5px;line-height:21px;color:var(--body);margin-top:8px;
  padding-top:8px;border-top:1px solid #ffe0e0}
.hit-o b{color:var(--fg)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--canvas);overflow-y:auto;
  display:none;padding-bottom:var(--xxl)}
.sheet.on{display:block}
.sheet header{display:flex;align-items:center;gap:12px}
.back{border:0;background:none;font-size:24px;color:var(--fg);padding:0 4px;line-height:1}
</style>
</head>
<body>

<header><div class="t" id="ttl">티어</div><div class="s" id="sub"></div></header>
<main id="view"><div class="empty"><span class="spin"></span></div></main>

<div class="sheet" id="sheet">
  <header>
    <button class="back" onclick="closeSheet()">←</button>
    <div style="flex:1;min-width:0">
      <div class="t" id="sttl" style="font-size:18px;line-height:27px;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap"></div>
      <div class="s" id="ssub"></div>
    </div>
  </header>
  <main id="sbody"></main>
</div>

<nav>
  <button class="on" data-t="tier" onclick="go('tier')"><span class="ic">▦</span>티어</button>
  <button data-t="new" onclick="go('new')"><span class="ic">✦</span>이번주</button>
  <button data-t="week" onclick="go('week')"><span class="ic">◍</span>주차</button>
  <button data-t="guide" onclick="go('guide')"><span class="ic">▣</span>공략</button>
  <button data-t="side" onclick="go('side')"><span class="ic">⊞</span>사이드</button>
  <button data-t="jp" onclick="go('jp')"><span class="ic">⇄</span>일본</button>
  <button data-t="set" onclick="go('set')"><span class="ic">⚙</span>설정</button>
</nav>

<script>
/* 이 앱은 **자기 데이터로 돈다.** APK 안에 담긴 data.json 을 읽어 화면을 그리고,
   맥에 붙을 수 있을 때만 새로 받아 덮어쓴다. 서버가 꺼져 있어도 전부 열린다. */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* onclick 안에 넣을 문자열 — JS 이스케이프 먼저, 그 다음 HTML */
const jesc = s => esc(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
let D = null, CUR = "tier";

document.addEventListener("click", () => closePop());
function boot() {
  try {
    D = JSON.parse(window.Bridge ? Bridge.load() : "{}");
  } catch (e) { D = null; }
  if (!D || !D.tier) {
    $("#view").innerHTML = `<div class="err">데이터를 읽지 못했습니다.</div>`;
    return;
  }
  go("tier");
  autoSync();          // 켤 때마다 조용히 최신으로 맞춘다
}

/* 저장된 주소가 있으면 **묻지 않고** 받아온다. 맥이 꺼져 있거나 밖이면
   조용히 실패하고 들고 있던 자료로 그냥 쓴다 — 화면을 막지 않는다. */
let SYNCING = false;
function autoSync() {
  if (!window.Bridge || SYNCING) return;
  const u = Bridge.getUrl();
  if (!u) return;
  SYNCING = true;
  mark("갱신 확인 중…");
  Bridge.sync(u);
}
function mark(t) {
  const s = $("#sub");
  if (s && CUR === "tier") s.textContent = t;
}
function go(t) {
  CUR = t;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.t === t));
  window.scrollTo(0, 0);
  // 없는 탭이면 첫 탭으로. 예전 버전이 저장해 둔 탭 이름('route')이 남아 있어도
  // 흰 화면이 되지 않게 한다 — 탭을 합치면 반드시 생기는 상황이다.
  const V = {tier:vTier, new:vNew, week:vWeek, guide:vGuide, side:vSide, jp:vJp, set:vSet};
  const f = V[t] || (CUR = "tier", V.tier);
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.t === CUR));
  f($("#view"));
}
function head(t, s) { $("#ttl").textContent = t; $("#sub").textContent = s || ""; }
const ago = iso => {
  if (!iso) return "";
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return d <= 0 ? "오늘" : d === 1 ? "어제" : `${d}일 전`;
};

/* ---------------- 티어 ---------------- */
function vTier(el) {
  const t = D.tier;
  head("티어", `${t.total}덱 · ${t.since} 이후 · 자료 ${ago(D.built_at)}`);
  const max = t.rows.length ? t.rows[0].share : 1;
  el.innerHTML = `<div class="card">${t.rows.map((x, i) => `
    <div class="item" onclick="openDeck('${esc(x.name)}')">
      <div class="rank">${i + 1}</div>
      <div class="bd">
        <div class="nm">${esc(x.label)}</div>
        <div class="sb">${x.n}덱 · 우승 ${x.wins} · 4강 ${x.top4}</div>
        <div class="bar"><i style="width:${(x.share / max * 100).toFixed(0)}%"></i></div>
      </div>
      <div class="vl"><span class="num">${x.share.toFixed(1)}</span><span class="muted small">%</span></div>
    </div>`).join("")}</div>`;
}

/* ---------------- 주차 · 권역 ---------------- */
let REG = "전체";
function vWeek(el) {
  const r = D.regions, ws = r.weeks;
  const regs = ["전체", ...Object.keys(r.region_total).filter(g => r.region_total[g] > 0)];
  if (!regs.includes(REG)) REG = "전체";
  head("주차별", `${ws[0]} ~ ${ws[ws.length - 1]}`);
  el.innerHTML = `
    <div class="chips">${regs.map(g =>
      `<button class="chip${g === REG ? " on" : ""}" onclick="setReg('${esc(g)}')">${esc(g)}</button>`).join("")}</div>
    <div class="small muted" id="wh" style="margin:var(--lg) 0 8px"></div>
    <div class="card" id="wk"></div>
    ${r.empty_weeks && r.empty_weeks.length ? `<div class="card small muted">
      자료가 없는 주: <b>${r.empty_weeks.map(esc).join(", ")}</b><br>
      대회가 없던 게 아니라 수집이 안 된 것입니다.</div>` : ""}`;
  drawWeek();
}
function setReg(g) { REG = g; vWeek($("#view")); }
function drawWeek() {
  const r = D.regions, ws = r.weeks;
  const cov = r.coverage[REG] || {};
  const base = ws.reduce((s, w) => s + (cov[w] || 0), 0);
  const rows = r.rows.map(x => {
    const cs = REG === "전체" ? x.cells : x.by_region[REG];
    return {label:x.label || x.archetype, n:cs.reduce((s, c) => s + c.n, 0), cs};
  }).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 14);
  $("#wh").textContent = `${REG} · 입상덱 ${base}건`;
  $("#wk").innerHTML = rows.length ? rows.map(x => `
    <div class="item">
      <div class="bd">
        <div class="nm">${esc(x.label)}</div>
        <div class="sb">${ws.map((w, i) => `${w.slice(-3)} ${x.cs[i].n || "·"}`).join("　")}</div>
      </div>
      <div class="vl"><span class="num">${base ? (x.n * 100 / base).toFixed(1) : "0.0"}</span><span class="muted small">%</span></div>
    </div>`).join("") : `<div class="empty">이 권역 자료가 없습니다</div>`;
}

/* ---------------- 이번 주 변화 ----------------

   메타는 주 단위로 돈다. 4주를 뭉뚱그린 채용률은 지난주에 처음 들어온 카드를
   옛 3주에 묻어버린다. 그래서 **지난주 덱리스트만** 따로 본다.

   비율이 아니라 건수로 적는다 — 덱리스트 2건에 "100%" 를 붙이면 2건을
   100건처럼 읽게 만든다. */
function vNew(el) {
  const W = D.whatsnew || [];
  const live = W.filter(x => x.week > 0 && x.cards.length);
  head("이번주", `지난주 덱리스트에 새로 들어온 카드 · 자료 ${ago(D.built_at)}`);
  if (!live.length) {
    el.innerHTML = `<div class="card"><div class="em">지난주 덱리스트가 아직 안 들어왔습니다.
      대회 결과는 있어도 덱 목록이 안 붙는 경우가 많습니다.</div></div>`;
    return;
  }
  const SEC = {main: "메인", extra: "엑스트라", side: "사이드"};
  el.innerHTML = live.map(x => {
    const lab = (D.tier.rows.find(t => t.name === x.archetype) || {}).label || x.archetype;
    return `<h4 style="margin:var(--xl) 0 8px">${esc(lab)}
        <span class="muted small">· 지난주 덱리스트 ${x.week}건</span></h4>
      <div class="card">${x.cards.map((c, i) => `
        <div class="item" style="align-items:flex-start" onclick="toggleNew(this)">
          <div class="bd">
            <div class="nm">${esc(c.name)}</div>
            <div class="sb">${SEC[c.section] || c.section} · <b>${x.week}건 중 ${c.k}건</b>${
              c.before ? ` · 그전 ${c.before}%` : " · 그전에는 없던 카드"}${
              c.released ? ` · 발매 ${esc(c.released)}` : ""}</div>
            <div class="newtx" style="display:none">${esc(c.text || "카드 텍스트가 없습니다.")}</div>
          </div>
          <div class="muted">▾</div>
        </div>`).join("")}</div>`;
  }).join("") + `<div class="card small muted">
      <b>왜 들어왔는지는 카드가 하는 일로 판단하세요.</b> 카드를 누르면 텍스트가 펼쳐집니다.
      이유를 지어내지 않았습니다.<br><br>
      지난주 상위 8위까지의 덱리스트만 셉니다. 대회 입상 기록은 훨씬 많지만
      덱 목록이 붙는 건 일부입니다.</div>`;
}
function toggleNew(el) {
  const t = el.querySelector(".newtx");
  if (t) t.style.display = t.style.display === "none" ? "block" : "none";
}

/* ---------------- 공략 ---------------- */
/* 공략 목록.

   **해설이 없어도 전개가 있으면 띄운다.** 예전에는 guides 만 훑어서, 전개를
   3갈래나 적어둔 덱이 목록에 아예 안 나왔다 — 자료를 만들어놓고 못 보는 꼴이다. */
function guideList() {
  const R = D.routes || {};
  const out = D.guides.map((g, i) => ({...g, gi: i}));
  const seen = new Set(out.map(x => x.archetype));
  Object.keys(R).forEach(a => {
    if (seen.has(a)) return;
    out.push({archetype: a, label: R[a].label || a, guide: "", gi: -1});
  });
  return out;
}

function vGuide(el) {
  const L = guideList(), R = D.routes || {};
  head("공략", `${L.length}덱 · 자료 ${ago(D.built_at)}`);
  el.innerHTML = `<div class="card">${L.map((g, i) => {
    const rt = R[g.archetype];
    const bits = [];
    if (rt) bits.push(`전개 ${rt.routes.length}갈래`);
    if (g.guide) bits.push(`해설 ${(g.guide.length / 1000).toFixed(1)}천자`);
    else bits.push("해설 없음");
    if (g.n_decks) bits.push(`입상덱 ${g.n_decks}`);
    return `<div class="item" onclick="openGuide(${i})">
      <div class="bd">
        <div class="nm">${esc(g.label)}</div>
        <div class="sb">${bits.join(" · ")}</div>
      </div>
      ${g.tier ? `<span class="tag${/3|외/.test(g.tier) ? " g" : ""}">${esc(g.tier)}</span>` : ""}
      <div class="muted">›</div>
    </div>`;
  }).join("")}</div>`;
}

let GI = 0, GR = 0;      // 열려 있는 공략 / 고른 초동
function openGuide(i) {
  GI = i; GR = 0;
  const g = guideList()[i];
  openSheet(g.label, "전개와 공략");
  drawGuide();
}

function drawGuide() {
  const g = guideList()[GI];
  const d = (D.routes || {})[g.archetype];
  const rt = d && d.routes[GR];
  $("#ssub").textContent = d && d.any_starter != null
    ? `초동 중 하나라도 ${d.any_starter}%` : "공략 해설";

  $("#sbody").innerHTML = `
    ${d ? counterBlock(d) : ""}
    ${d ? routeBlock(d, rt) : ""}
    ${whyBlock(d)}
    ${g.guide ? `<h4 style="margin:var(--xl) 0 8px">해설 전문</h4>
      <div class="card"><div class="doc">${md(g.guide)}</div></div>`
      : `<div class="card small muted">이 덱은 아직 해설 글이 없습니다. 위의 전개가 전부입니다.</div>`}
    ${(D.videos[g.archetype] || []).length ? `
      <h4 style="margin:var(--xl) 0 8px">근거 영상</h4>
      <div class="card">${D.videos[g.archetype].map(v => `
        <div class="item"><div class="bd">
          <div class="nm" style="font-size:15px">${esc(v.title)}</div>
          <div class="sb">${esc(v.url)}</div></div></div>`).join("")}</div>` : ""}`;
}

/* 이 전개가 **지금 우승하는 덱리스트에도 맞는지.**

   전개법은 쓴 순간부터 낡는다. 언제 기준인지 안 적으면 읽는 사람이 그걸 알
   방법이 없다. 날짜는 손으로 안 적고 입상 덱리스트에서 찾아 온다. */
function freshBlock(d, rt) {
  const f = rt.fresh, df = d.fresh;
  if (!f) return "";
  const b = f.basis, w = f.works;

  // 근거 — 이 전개가 성립하는 가장 최근 상위입상덱
  let head;
  if (b) {
    const who = [b.date, b.placement].filter(Boolean).join(" · ");
    head = `<div class="fr-h"><span class="fr-ok">기준</span>
        <b>${esc(who)}</b> 덱리스트</div>
      <div class="fr-b">${esc(b.tournament || "")}${
        b.region ? ` · ${esc(b.region)}` : ""}${b.players ? ` · ${b.players}인` : ""}</div>`;
  } else if (f.starter_where === "global") {
    head = `<div class="fr-h"><span class="fr-no">주의</span>
        <b>이 전개의 초동이 우리 입상덱 자료에 한 번도 안 나옵니다</b></div>
      <div class="fr-b">다른 구성을 전제한 전개일 수 있습니다.</div>`;
  } else if (!f.starter_where) {
    head = `<div class="fr-h"><span class="fr-un">확인 불가</span>
        <b>초동 카드 이름을 우리 자료에서 못 찾았습니다</b></div>
      <div class="fr-b">맞는지 틀린지 판단하지 않았습니다.</div>`;
  } else {
    head = `<div class="fr-h"><span class="fr-no">없음</span>
        <b>이 전개가 성립하는 상위입상덱이 없습니다</b></div>
      <div class="fr-b">지금 우승하는 덱은 이 형태가 아닙니다.</div>`;
  }

  // 성립 건수 — **지난주가 1순위.** 4주는 참고로 뒤에 붙인다.
  const k = f.week;
  const rate = k && k.of
    ? `<div class="fr-b">지난주 덱리스트 <b>${k.of}건 중 ${k.n}건</b>에서 성립${
        w && w.of ? ` <span class="muted">· 4주 누적 ${w.of}건 중 ${w.n}건</span>` : ""}</div>`
    : `<div class="fr-b">지난주에는 덱리스트가 딸린 상위입상덱이 없습니다.${
        w && w.of ? ` 4주 누적으로는 ${w.of}건 중 ${w.n}건.` : ""}</div>`;

  // 이 전개가 안 쓰는 새 카드
  const miss = (f.missing || []).length ? `
    <div class="fr-new">
      <div class="fr-nh">지난주 덱에 새로 들어왔는데 이 전개가 안 쓰는 카드</div>
      ${f.missing.map(m => `<div class="fr-nr"><span>${esc(m.name)}</span>
        <b>${m.of}건 중 ${m.k}건</b></div>`).join("")}
      <div class="fr-b" style="margin-top:8px">덱 형태가 옮겨갔다는 뜻입니다.
        이 전개는 그 형태를 반영하지 않았습니다.</div>
    </div>` : "";

  const cav = rt.caveat ? `<div class="fr-cav">${md(rt.caveat)}</div>` : "";

  const thin = df && df.week < 3
    ? `<div class="fr-b" style="margin-top:8px">지난주 덱리스트가 ${df.week}건뿐입니다.
        건수 그대로 읽어주세요 — 비율로 늘려 말하지 않았습니다.</div>` : "";

  return `<div class="card fr">${head}${rate}${cav}${miss}${thin}</div>`;
}

/* **이 덱을 상대할 때 무엇을 던지나.** 공략 맨 위에 놓는다.

   전개는 «이 덱을 굴리는 법» 이다. 정작 자주 필요한 건 반대쪽이라, 읽는 사람이
   맨 먼저 보게 한다. 확인된 것(전개 자료의 저지점)과 추정한 것을 **섞지 않는다.** */
function counterBlock(d) {
  const c = d.counter;
  if (!c) return "";
  const ht = c.handtraps || [], tg = c.trap_guess || [], sd = c.sides || [];
  if (!ht.length && !tg.length && !sd.length) return "";

  const axes = Object.entries(c.lift || {}).sort((a, b) => b[1] - a[1]).slice(0, 4);

  const where = h => h.where.map(w =>
    `<span class="wchip">${esc(w.route)}${w.step ? ` ${w.step}단계` : " 전반"}</span>`).join("");

  return `<div class="card ctr">
    <div class="ctr-h">이 덱을 상대할 때</div>
    ${axes.length ? `<div class="ctr-ax">${axes.map(([k, v]) =>
      `<span class="axchip">${esc(k)} <b>${v}배</b></span>`).join("")}</div>
      <div class="ctr-b">다른 덱보다 이만큼 더 씁니다. 여기를 막는 카드가 잘 듭니다.</div>` : ""}

    ${ht.length ? `<div class="ctr-s">확인된 저지점 <span class="muted">· 전개 자료에서</span></div>
      ${ht.slice(0, 6).map(h => `<div class="ctr-r">
        <div class="ctr-n">${linkCards(esc(h.card))}</div>
        <div class="ctr-w">${where(h)}</div>
        <div class="ctr-e">${esc(h.where[0].effect || "")}</div>
        ${h.outs.length ? `<div class="ctr-o">관통: ${h.outs.map(o => esc(o)).join(" · ")}</div>` : ""}
      </div>`).join("")}` : ""}

    ${tg.length ? `<div class="ctr-s">그 밖에 들 만한 패트랩
        <span class="muted">· 전개를 읽고 짚은 <b>추정</b></span></div>
      ${tg.slice(0, 6).map(t => `<div class="ctr-r">
        <div class="ctr-n">${linkCards(esc(t.card))}
          <span class="muted small">· ${t.where.length}갈래에서</span></div>
        <div class="ctr-e">${esc(t.note)}</div>
        ${t.where.slice(0, 3).map(w => `<div class="ctr-p">
          <span class="wchip">${esc(w.route)} ${w.step}단계</span>
          <span class="ctr-q">${linkCards(esc(w.text))}</span></div>`).join("")}
      </div>`).join("")}` : ""}

    ${sd.length ? `<div class="ctr-s">사이드에서 가져올 것
        <span class="muted">· 이 덱이 남달리 많이 쓰는 것을 막는 카드 · <b>추정</b></span></div>
      ${sd.slice(0, 6).map(t => `<div class="ctr-r">
        <div class="ctr-n">${linkCards(esc(t.name))}
          <span class="muted small">· 환경 사이드 ${t.share}%</span></div>
        <div class="ctr-e">${esc(t.hits[0].axis)}를 막는다 —
          이 덱은 평균의 <b>${t.hits[0].lift}배</b> 쓴다</div>
        ${(t.hits[0].where || []).slice(0, 3).map(w => `<div class="ctr-p">
          <span class="wchip">${esc(w.route)} ${w.step}단계</span>
          <span class="ctr-q">${linkCards(esc(w.text))}</span></div>`).join("")}
      </div>`).join("")}` : ""}

    <div class="ctr-b" style="margin-top:12px">
      <b>«확인된 저지점»만 근거가 있는 것</b>입니다. 아래 둘은 카드 텍스트와 이 덱의
      전개를 맞춰 고른 것이고 <b>승률 자료가 아닙니다.</b></div>
  </div>`;
}

/* 신규 카드를 **왜 넣나.**

   "지난주에 이 카드가 들어왔다" 까지는 덱리스트가 알려주지만, 왜 들어왔는지는
   못 알려준다. 그건 카드가 뭘 하는지를 봐야 안다. 이유를 지어내지 않고
   영상·카드 텍스트에서 옮긴 것만 싣는다. */
function whyBlock(d) {
  // 전개 자료가 아예 없는 덱은 d 가 없다 — 여기서 터지면 공략이 안 열린다
  const w = (d && d.why) || [];
  if (!w.length) return "";
  return `<h4 style="margin:var(--xl) 0 8px">왜 이 카드를 넣나
      <span class="muted small">· ${w.length}장</span></h4>
    <div class="card">${w.map(c => `
      <div class="why">
        <div class="nm">${esc(c.ko || c.name)}</div>
        ${c.ko && c.name !== c.ko ? `<div class="sb">${esc(c.name)}</div>` : ""}
        <div class="whytx">${md(c.text)}</div>
      </div>`).join("")}</div>
    ${d.why_source ? `<div class="card small muted">근거: ${esc(d.why_source)}</div>` : ""}`;
}

/* 전개 글에서 **카드 이름을 눌러 효과를 본다.**

   새 화면으로 넘기면 읽던 자리를 잃는다. 그래서 누른 자리 바로 아래에
   말풍선을 띄우고, 아무 데나 다시 누르면 닫는다.

   이름 표시는 화면에서 한다 — 원본 글을 건드리지 않아야 나중에 다른 형태로
   다시 뽑을 수 있다. */
let CARDKEYS = null;
function cardKeys() {
  if (!CARDKEYS) {
    // 긴 이름부터 찾아야 «엘펜노츠 루키나» 가 «엘펜노츠» 로 먼저 걸리지 않는다
    CARDKEYS = Object.keys(D.cards || {}).sort((a, b) => b.length - a.length);
  }
  return CARDKEYS;
}

/* 글 안의 카드 이름을 누를 수 있게 감싼다. 이미 esc() 된 글을 받는다. */
function linkCards(safe, ctx) {
  const ks = cardKeys();
  if (!ks.length) return safe;
  let out = safe, marks = [];
  ks.forEach(name => {
    const e = esc(name);
    if (out.indexOf(e) < 0) return;
    const id = marks.length;
    marks.push(name);
    out = out.split(e).join(`\u0000${id}\u0001`);
  });
  return out.replace(/\u0000(\d+)\u0001/g, (_, i) =>
    `<span class="cardw" onclick="popCard(event,'${jesc(marks[+i])}','${jesc(ctx || "")}')">${
      esc(marks[+i])}</span>`);
}

/* 카드 텍스트를 ①②③ 단위로 자르고, 지금 단계가 쓰는 번호만 색을 준다.
   전개 글이 «②의 효과로» 처럼 번호를 대주는 경우가 많아서 그걸 그대로 쓴다. */
const _CIRC = "①②③④⑤⑥⑦⑧⑨";
function markEffects(text, useNums) {
  const parts = [];
  let cur = "", curN = 0;
  for (const ch of text) {
    const i = _CIRC.indexOf(ch);
    if (i >= 0) { if (cur) parts.push({n: curN, t: cur}); cur = ch; curN = i + 1; }
    else cur += ch;
  }
  if (cur) parts.push({n: curN, t: cur});
  return parts.map(p => p.n && useNums.has(p.n)
    ? `<b class="eff">${esc(p.t)}</b>` : esc(p.t)).join("");
}

function popCard(ev, name, ctx) {
  ev.stopPropagation();
  const c = (D.cards || {})[name];
  const old = document.querySelector("#pop");
  if (old && old.dataset.name === name) { closePop(); return; }
  closePop();
  const el = document.createElement("div");
  el.id = "pop"; el.className = "pop"; el.dataset.name = name;
  el.innerHTML = `<div class="pop-n">${esc(name)}</div>
    ${c && c.spec ? `<div class="pop-s">${esc(c.spec)}</div>` : ""}
    <div class="pop-t">${c && c.text
      ? markEffects(c.text, effNums(ctx))
      : "이 카드의 한글 텍스트를 아직 못 받았습니다."}</div>
    ${c && c.text && effNums(ctx).size ? `<div class="pop-w">색칠한 곳이 이 단계에서 쓰는 효과입니다</div>` : ""}`;
  document.body.appendChild(el);
  // 누른 자리 아래에. 화면 밖으로 나가면 안쪽으로 밀어 넣는다.
  const r = ev.target.getBoundingClientRect();
  const w = Math.min(320, window.innerWidth - 24);
  el.style.width = w + "px";
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
  el.style.left = left + "px";
  const below = r.bottom + 8;
  if (below + el.offsetHeight > window.innerHeight - 12 && r.top > el.offsetHeight + 20) {
    el.style.top = (r.top - el.offsetHeight - 8) + "px";
  } else {
    el.style.top = below + "px";
  }
}

/* 그 단계 글에 적힌 ①②③ 을 모은다. 없으면 아무 데도 색을 안 준다. */
function effNums(ctx) {
  const out = new Set();
  if (!ctx) return out;
  for (const ch of ctx) { const i = _CIRC.indexOf(ch); if (i >= 0) out.add(i + 1); }
  return out;
}

function closePop() {
  const p = document.querySelector("#pop");
  if (p && p.parentNode) p.parentNode.removeChild(p);
}

/* 출처 한 줄. **source 는 {kind,id,url,text} 인 객체다** — 예전처럼 문자열로
   찍으면 [object Object] 가 나온다. */
function srcLine(src) {
  if (!src) return "";
  if (typeof src === "string") return ` 근거: ${esc(src)}`;
  if (src.kind === "youtube" && src.id)
    return ` 근거: 유튜브 <b>${esc(src.id)}</b>`;
  return src.text ? ` 근거: ${esc(src.text)}` : "";
}

/* 전개 한 갈래. **각 단계에 "여기서 맞으면" 을 바로 붙인다** —
   따로 모아두면 몇 단계 이야기인지 눈으로 못 잇는다. */
function routeBlock(d, rt) {
  if (!rt) return "";
  const s = rt.starter_stat;
  const pct = v => `<span class="num">${v}</span><span class="muted small">%</span>`;
  const general = rt.breaks.filter(b => !b.step);       // 전개 전반
  const atStep = n => rt.breaks.filter(b => b.step === n);
  const atGuess = n => (rt.guess || []).filter(b => b.step === n);

  /* 추정 지점. 확인된 저지점과 **생김새를 다르게** 한다 — 근거의 무게가 다르다. */
  const gss = g => `<div class="gs">
    <span class="gs-x">?</span> <b>${esc(g.card)}</b>
    <span class="muted">— ${esc(g.note)}</span>
    <div class="gs-w">이 단계에 «${esc(g.why)}» 가 있어서 짚었습니다 · <b>추정</b></div>
  </div>`;

  const hit = b => {
    const o = b.out_stat;
    return `<div class="hit">
      <div class="hit-h">
        <span class="hit-x">✕</span>
        <b>${linkCards(esc(b.card))}</b> 를 맞으면
        ${o ? `<span class="hit-p">${o.p}%</span>` : ""}
      </div>
      <div class="hit-b">${linkCards(esc(b.effect))}</div>
      <div class="hit-o">${o
        ? `<b>→ ${esc(b.out_card)}</b> 가 패에 있으면 뚫린다
           <span class="muted">(채용 ${o.share}% × ${o.copies}장 → ${o.p}%)</span>`
        : `→ ${esc(b.out)}`}</div>
    </div>`;
  };

  return `
    ${d.routes.length > 1 ? `<div class="chips">${d.routes.map((x, i) =>
      `<button class="chip${i === GR ? " on" : ""}" onclick="GR=${i};drawGuide()">${
        esc(x.label || x.starter)}</button>`).join("")}</div>` : ""}

    ${freshBlock(d, rt)}

    <div class="card" style="margin-top:var(--lg)">
      <div class="row between">
        <div class="bd"><div class="nm">${esc(rt.label || rt.starter)}</div>
          ${rt.starter_ja ? `<div class="orig">${esc(rt.starter_ja)}</div>` : ""}
          <div class="sb" style="white-space:normal">${esc(rt.summary || rt.note || "")}</div>
          ${rt.hand && rt.hand !== rt.summary ? `<div class="sb" style="white-space:normal">시작 패 · ${esc(rt.hand)}</div>` : ""}
        </div>
        <div class="vl">${s ? pct(s.p) : `<span class="muted small">—</span>`}</div>
      </div>
      ${s ? `<div class="bar"><i style="width:${Math.min(s.p * 2, 100)}%"></i></div>
        <div class="small muted" style="margin-top:6px">
          채용 ${s.share}% · 평균 ${s.copies}장 → 선공 5장에 잡힐 확률 ${s.p}%</div>`
        : `<div class="small muted" style="margin-top:6px">
          확률을 못 냅니다 — 우리 입상덱 자료에 이 카드가 없습니다.</div>`}
      <div class="small" style="margin-top:12px"><span class="tag">${esc(rt.disrupt || "")}</span></div>
    </div>

    ${general.length ? `<div class="card" style="padding:var(--lg)">
      <div class="small muted" style="margin-bottom:8px">전개 전반에 걸리는 것</div>
      ${general.map(hit).join("")}</div>` : ""}

    <h4 style="margin:var(--xl) 0 8px">전개 순서
      <span class="muted small">· ${rt.steps.length}단계</span></h4>
    <div class="card">${rt.steps.map((st, i) => {
      const bs = atStep(i + 1), gs = atGuess(i + 1);
      return `<div class="step${bs.length ? " danger" : (gs.length ? " warn" : "")}">
        <div class="step-h">
          <div class="step-n">${i + 1}</div>
          <div class="bd">
            <div class="step-t">${linkCards(esc(st.t), st.t)}</div>
            ${st.t_ja ? `<div class="orig">${esc(st.t_ja)}</div>` : ""}
            ${st.ts ? `<div class="sb">${esc(st.ts)}</div>` : ""}
          </div>
        </div>
        ${bs.map(hit).join("")}
        ${gs.map(gss).join("")}
      </div>`;
    }).join("")}</div>

    ${rt.board && rt.board.length ? `
      <h4 style="margin:var(--xl) 0 8px">최종 반면</h4>
      <div class="card">${rt.board.map(b =>
        `<div class="item"><div class="bd"><div class="nm">${linkCards(esc(b))}</div></div></div>`).join("")}</div>` : ""}

    <div class="card small muted">
      확률은 <b>덱 40장 · 선공 5장</b> 기준, 채용률 × 평균 매수 가중입니다.
      3장이면 33.8% · 2장 23.7% · 1장 12.5%.${srcLine(rt.source)}
    </div>`;
}

/* 마크다운 — 표·코드·인용까지 (공략 글이 이 문법을 쓴다) */
function md(src) {
  const lines = esc(src).split("\n");
  let out = [], i = 0;
  const block = s => /^(#{1,6}\s|&gt;|\||```|[-*]\s)/.test(s);
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre>${buf.join("\n")}</pre>`); continue;
    }
    if (/^\|/.test(l) && /^\|[\s:|-]+\|?$/.test(lines[i + 1] || "")) {
      const cell = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const hd = cell(l); i += 2;
      const body = [];
      while (i < lines.length && /^\|/.test(lines[i])) body.push(cell(lines[i++]));
      out.push(`<table><thead><tr>${hd.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>
        <tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    let m;
    if ((m = l.match(/^#{1,6}\s*(.+)$/))) { out.push(`<h3>${inline(m[1])}</h3>`); i++; continue; }
    if (/^&gt;/.test(l)) {
      const buf = [];
      while (i < lines.length && /^&gt;/.test(lines[i]))
        buf.push(lines[i++].replace(/^&gt;\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue;
    }
    if (/^[-*]\s/.test(l)) {
      const buf = [];
      while (i < lines.length && /^[-*]\s/.test(lines[i]))
        buf.push(`<li>${inline(lines[i++].replace(/^[-*]\s/, ""))}</li>`);
      out.push(`<ul>${buf.join("")}</ul>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    // **첫 줄은 조건 없이 삼킨다.** 블록 기호로 시작하는데 위에서 안 걸린 줄
    // (` 로 여는 인라인 코드, 구분선 없는 표…) 이 문단 첫 줄이면, 여기서
    // 걸러내는 순간 i 가 안 늘어 무한 루프가 된다 — 화면이 통째로 멈춘다.
    const buf = [lines[i++]];
    while (i < lines.length && lines[i].trim() && !block(lines[i]))
      buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join("<br>"))}</p>`);
  }
  return out.join("");
}

/* ---------------- 사이드 ---------------- */
function vSide(el) {
  const ks = Object.keys(D.sides);
  head("사이드", "덱을 누르면 사이드·특이 채용");
  el.innerHTML = `<div class="card">${ks.map(k => `
    <div class="item" onclick="openDeck('${esc(k)}')">
      <div class="bd"><div class="nm">${esc(D.sides[k].label || k)}</div>
        <div class="sb">입상덱 ${D.sides[k].decks}개</div></div>
      <div class="muted">›</div>
    </div>`).join("") || `<div class="empty">자료 없음</div>`}</div>`;
}
function openDeck(name) {
  const s = D.sides[name];
  if (!s) { const g = D.guides.findIndex(g => g.archetype === name);
            return g >= 0 ? openGuide(g) : null; }
  openSheet(s.label || name, `입상덱 ${s.decks}개 · 최근 6개월`);
  const line = (nm, v, sub) => `
    <div class="item"><div class="bd"><div class="nm">${esc(nm)}</div>
      <div class="sb">${esc(sub || "")}</div></div>
      <div class="vl"><span class="num">${v.toFixed(0)}</span><span class="muted small">%</span></div></div>`;
  const gi = D.guides.findIndex(g => g.archetype === name);
  $("#sbody").innerHTML = `
    ${gi >= 0 ? `<button class="p" style="margin-bottom:var(--lg)"
        onclick="openGuide(${gi})">공략 해설 보기</button>` : ""}
    <h4 style="margin:0 0 8px">사이드덱</h4>
    <div class="card">${s.side.map(x =>
      line(x.name, x.side, `평균 ${x.avg}장 · ${x.placement}${
        x.roles.length ? " · " + x.roles.slice(0,2).join("/") : ""}`)).join("")
      || `<div class="empty">자료 없음</div>`}</div>
    <h4 style="margin:var(--xl) 0 8px">특이 채용
      <span class="muted small">· 이 덱만 유난히 많이 쓰는 카드</span></h4>
    ${s.engines.map(e => `<div class="card">
      <div class="small" style="color:var(--primary);font-weight:600;margin-bottom:8px">
        ${esc(e.engine === "(단독)" ? "낱장" : e.engine)}</div>
      ${e.cards.map(c => line(c.name, Math.max(c.main, c.side),
        `전체 ${c.global}% · ×${c.lift}`)).join("")}</div>`).join("")
      || `<div class="card"><div class="empty">없음</div></div>`}`;
}

/* ---------------- 일본 주간 티어표 ----------------
   ガチまとめ 가 매주 올리는 S/A/B 랭크 표. 우리 집계(크롤링)와 **다른 출처**라
   서로 대조하는 게 값이다. 여기 나온 덱은 우리가 못 잡은 것도 **전부** 보여준다. */
let JPW = 0;
function vJp(el) {
  const j = D.jp;
  if (!j || !j.weeks.length) {
    head("일본", "");
    el.innerHTML = `<div class="card"><div class="empty">일본 주간 자료가 없습니다.<br>
      맥에서 <b>meta jp-sync</b> 를 돌린 뒤 갱신하세요.</div></div>`;
    return;
  }
  if (JPW >= j.weeks.length) JPW = 0;
  const w = j.weeks[JPW];
  head("일본 주간 티어", `${j.source} · ${w.date}`);

  const rankOrder = {S:0, A:1, B:2, C:3, D:4};
  const byRank = {};
  w.tiers.forEach(t => (byRank[t.rank] = byRank[t.rank] || []).push(t.name));
  const ours = ja => {
    const d = j.decks.find(x => x.ja === ja);
    return d && d.label ? d.label : null;
  };
  const gi = ja => {
    const d = j.decks.find(x => x.ja === ja);
    return d && d.archetype ? D.guides.findIndex(g => g.archetype === d.archetype) : -1;
  };
  const chipRow = ja => {
    const lab = ours(ja), i = gi(ja);
    return `<div class="item"${i >= 0 ? ` onclick="openGuide(${i})"` : ""}>
      <div class="bd">
        <div class="nm">${esc(lab || ja)}</div>
        <div class="sb">${lab ? esc(ja) : "우리 자료에 없는 덱"}</div>
      </div>${i >= 0 ? `<div class="muted">›</div>` : ""}</div>`;
  };

  const total = w.total || 1;
  el.innerHTML = `
    <div class="chips">${j.weeks.map((x, i) =>
      `<button class="chip${i === JPW ? " on" : ""}" onclick="JPW=${i};vJp($('#view'))">${
        esc(x.date.slice(5))}</button>`).join("")}</div>

    ${Object.keys(byRank).sort((a, b) => (rankOrder[a] ?? 9) - (rankOrder[b] ?? 9))
      .map(r => `
      <h4 style="margin:var(--xl) 0 8px">${esc(r)}랭크
        <span class="muted small">· ${byRank[r].length}덱</span></h4>
      <div class="card">${byRank[r].map(chipRow).join("")}</div>`).join("")
      || `<div class="card"><div class="empty">이 주차엔 티어표가 없습니다</div></div>`}

    ${w.dist.length ? `
      <h4 style="margin:var(--xl) 0 8px">예선 덱 분포
        <span class="muted small">· 분류된 ${total}덱${
          w.players ? ` / 참가 ${w.players}명` : ""}</span></h4>
      <div class="card">${w.dist.map(d => {
        const lab = ours(d.name), i = gi(d.name);
        return `<div class="item"${i >= 0 ? ` onclick="openGuide(${i})"` : ""}>
          <div class="bd"><div class="nm">${esc(lab || d.name)}</div>
            <div class="sb">${lab ? esc(d.name) : "우리 자료에 없는 덱"}</div>
            <div class="bar"><i style="width:${(d.n / total * 100).toFixed(0)}%"></i></div></div>
          <div class="vl"><span class="num">${d.n}</span><span class="muted small">덱</span></div>
        </div>`;
      }).join("")}</div>
      ${w.other ? `<div class="card small muted">그 밖(その他) ${w.other}명은
        분류되지 않아 위 비율에서 빠졌습니다.</div>` : ""}` : ""}

    <h4 style="margin:var(--xl) 0 8px">여기 나온 덱 전부
      <span class="muted small">· ${j.decks.length}종</span></h4>
    <div class="card">${j.decks.map(d => {
      const ranks = [...new Set(d.tiers.map(t => t.rank))].sort(
        (a, b) => (rankOrder[a] ?? 9) - (rankOrder[b] ?? 9));
      const i = d.archetype ? D.guides.findIndex(g => g.archetype === d.archetype) : -1;
      return `<div class="item"${i >= 0 ? ` onclick="openGuide(${i})"` : ""}>
        <div class="bd">
          <div class="nm">${esc(d.label || d.ja)}</div>
          <div class="sb">${d.label ? esc(d.ja) : "우리 자료에 없는 덱"}${
            d.n ? ` · 누적 ${d.n}덱` : ""}</div>
        </div>
        ${ranks.length ? `<span class="tag${ranks[0] === "S" ? "" : " g"}">${
          esc(ranks.join("/"))}</span>` : ""}
        ${i >= 0 ? `<div class="muted">›</div>` : ""}</div>`;
    }).join("")}</div>

    <div class="card small muted">
      우리 티어표는 대회 입상을 직접 세어 만든 것이고, 이 표는
      <b>${esc(j.source)}</b> 가 매주 올리는 평가입니다. <b>출처가 다르니 어긋날 수
      있습니다</b> — 어긋나는 지점이 오히려 볼 값이 있습니다.<br><br>
      회색 이름표가 붙은 덱은 <b>우리 수집에는 안 잡힌 덱</b>입니다.
    </div>`;
}

/* ---------------- 설정 · 갱신 ---------------- */
function vSet(el) {
  head("설정", "");
  const url = window.Bridge ? Bridge.getUrl() : "";
  el.innerHTML = `
    <div class="card">
      <div class="row between"><div class="nm">앱 안의 자료</div>
        <div class="num">${ago(D.built_at)}</div></div>
      <div class="small muted" style="margin-top:4px">
        ${esc((D.built_at || "").replace("T", " ").slice(0, 16))} 기준<br>
        티어 ${D.tier.rows.length} · 공략 ${D.guides.length} · 사이드 ${Object.keys(D.sides).length}덱
      </div>
    </div>
    <div class="card">
      <div class="nm" style="margin-bottom:8px">자료 갱신</div>
      <div class="small muted" style="margin-bottom:var(--lg)">
        <b>손댈 것 없습니다.</b> 앱을 켤 때마다 알아서 최신으로 맞춥니다.
        와이파이든 데이터든 인터넷만 되면 되고, 맥은 켜져 있지 않아도 됩니다.
        인터넷이 안 되면 조용히 넘어가고 들고 있던 자료를 그대로 씁니다.
        <br><br>아래 주소는 자료를 받아오는 곳입니다. 바꿀 일은 거의 없습니다.</div>
      <input id="u" value="${esc(url)}" placeholder="https://raw.githubusercontent.com/…"
        style="width:100%;height:52px;border:0;border-radius:12px;background:var(--surface);
        padding:0 14px;font-size:15px;font-family:inherit;color:var(--fg)">
      <button class="p" style="margin-top:12px" onclick="doSync()">지금 갱신</button>
      <div id="sy" class="small" style="margin-top:12px"></div>
    </div>`;
}
function doSync() {
  const u = $("#u").value.trim();
  if (!u) return;
  $("#sy").innerHTML = `<span class="spin"></span> 받는 중…`;
  Bridge.sync(u);
}
window.onSync = json => {
  SYNCING = false;
  let n;
  try { n = JSON.parse(json); } catch (e) { return window.onSyncError("자료를 읽지 못했습니다"); }
  const fresh = !D || n.built_at !== D.built_at;
  D = n;
  const box = $("#sy");
  if (box) box.innerHTML = `<b style="color:var(--primary)">갱신 완료</b> · 티어 ${
    D.tier.rows.length} · 공략 ${D.guides.length}`;
  // 자동 갱신이면 보던 화면을 그대로 다시 그린다(튕기지 않게)
  if (fresh) go(CUR); else mark("");
};
window.onSyncError = msg => {
  SYNCING = false;
  const box = $("#sy");
  if (box) box.innerHTML = `<span style="color:var(--danger)">${esc(msg)}</span>`;
  else mark("");     // 자동 갱신 실패는 조용히 넘어간다 — 자료는 이미 있다
};

/* ---------------- 시트 ---------------- */
function openSheet(t, s) {
  $("#sttl").textContent = t; $("#ssub").textContent = s || "";
  $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0;
  history.pushState({sheet:1}, "");
}
function closeSheet() {
  $("#sheet").classList.remove("on");
  if (history.state && history.state.sheet) history.back();
}
window.addEventListener("popstate", () => $("#sheet").classList.remove("on"));
window.appBack = () => {
  // 말풍선이 떠 있으면 그것부터 닫는다 — 뒤로가기로 화면이 통째로 넘어가면
  // 읽던 자리를 잃는다
  if (document.querySelector("#pop")) { closePop(); return true; }
  if ($("#sheet").classList.contains("on")) { closeSheet(); return true; }
  if (CUR !== "tier") { go("tier"); return true; }
  return false;
};
boot();
</script>
</body>
